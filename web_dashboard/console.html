<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>University Network Management Console</title>
<style>
  body {
    font-family: Tahoma, Arial, sans-serif;
    background-color: #eef2f7;
    color: #222222;
    margin: 0;
    padding: 0;
  }

  .header {
    background-color: #1f3c5c;
    color: #ffffff;
    padding: 25px;
    text-align: center;
  }

  .header h1 {
    margin: 0 0 6px 0;
    font-size: 22px;
  }

  .header p {
    margin: 0;
    font-size: 12px;
    color: #cfd9e3;
  }

  .content {
    width: 90%;
    max-width: 700px;
    margin: 25px auto;
  }

  .summary-box {
    background-color: #ffffff;
    border-radius: 6px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
    border: 2px solid #dddddd;
  }

  .summary-box h2 {
    margin: 0 0 8px 0;
    font-size: 18px;
  }

  .summary-ok    { color: #2e7d32; }
  .summary-warn  { color: #e65100; }
  .summary-fail  { color: #c62828; }

  table {
    width: 100%;
    border-collapse: collapse;
    background-color: #ffffff;
    border-radius: 6px;
    overflow: hidden;
  }

  th, td {
    padding: 12px;
    text-align: right;
    border-bottom: 1px solid #eeeeee;
    font-size: 14px;
  }

  th {
    background-color: #2e5c8a;
    color: #ffffff;
  }

  td.ip {
    direction: ltr;
    text-align: left;
    color: #555555;
  }

  .status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: bold;
    direction: ltr;
  }

  .status-online {
    background-color: #dff5e1;
    color: #2e7d32;
  }

  .status-offline {
    background-color: #fde3e3;
    color: #c62828;
  }

  .status-checking {
    background-color: #f0f0f0;
    color: #888888;
  }

  .status-na {
    background-color: #eeeeee;
    color: #777777;
  }

  .controls {
    text-align: center;
    margin-bottom: 20px;
  }

  .controls button {
    background-color: #2e5c8a;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    font-family: Tahoma, Arial, sans-serif;
  }

  .last-update {
    text-align: center;
    font-size: 11px;
    color: #888888;
    margin-top: 10px;
  }
</style>
</head>
<body>

  <div class="header">
    <h1>University Network Management Console</h1>
    <p>کنسول مدیریت و پایش زنده‌ی سرویس‌های شبکه دانشگاه</p>
  </div>

  <div class="content">

    <div class="controls">
      <button id="refreshBtn">بررسی الان (Refresh)</button>
    </div>

    <div class="summary-box" id="summaryBox">
      <h2 id="summaryText">در حال بررسی اولیه ...</h2>
    </div>

    <table>
      <thead>
        <tr>
          <th>سرویس</th>
          <th>IP</th>
          <th>وضعیت</th>
        </tr>
      </thead>
      <tbody id="serviceTableBody">
        <!-- Rows generated by JS -->
      </tbody>
    </table>

    <div class="last-update" id="lastUpdate"></div>

  </div>

<script>
  var SERVICES = [
    { name: "DNS Server",         ip: "10.10.4.11", port: 53, protocol: "udp" },
    { name: "Web Server",         ip: "10.10.4.13", port: 80, protocol: "tcp" },
    { name: "Mail Server (SMTP)", ip: "10.10.4.12", port: 25, protocol: "tcp" },
    { name: "File Server (FTP)",  ip: "10.10.4.14", port: 21, protocol: "tcp" }
  ];

  var TIMEOUT_MS = 2500;
  var AUTO_REFRESH_MS = 10000;

  // شمارنده‌ی نسل (generation): هر بار که یک دور بررسی جدید شروع می‌شود،
  // این عدد افزایش می‌یابد. اگر نتیجه‌ی یک درخواست قدیمی دیرتر از شروع
  // دور جدید برسد، با مقایسه‌ی این شمارنده تشخیص داده و نادیده گرفته می‌شود
  // تا داده‌ی قدیمی روی وضعیت جدید و درست بازنویسی نکند.
  var currentGeneration = 0;
  var isChecking = false;

  function renderInitialTable() {
    var tbody = document.getElementById("serviceTableBody");
    tbody.innerHTML = "";
    for (var i = 0; i < SERVICES.length; i++) {
      var s = SERVICES[i];
      var row = document.createElement("tr");
      row.id = "row-" + i;
      row.innerHTML =
        "<td>" + s.name + "</td>" +
        "<td class='ip'>" + s.ip + ":" + s.port + "</td>" +
        "<td><span class='status-badge status-checking' id='badge-" + i + "'>در حال بررسی...</span></td>";
      tbody.appendChild(row);
    }
  }

  // تلاش برای اتصال به سرویس با fetch و timeout دستی.
  //
  // نتیجه‌ی تست تشخیصی واقعی روی این پروژه نشان داد:
  //   - وقتی یک سرویس در Packet Tracer خاموش است، Server-PT با یک پاسخ
  //     HTTP واقعی و status=503 (Service Unavailable) جواب می‌دهد.
  //   - وقتی سرویس روشن است ولی پروتکلش HTTP نیست (مثل FTP/SMTP)، سرور
  //     بلافاصله داده‌ی پروتکل خودش (نه HTTP) را می‌فرستد که مرورگر آن را
  //     نمی‌فهمد و fetch() هرگز resolve/reject نمی‌شود (می‌ماند تا Timeout).
  //   - وقتی سرویس روشن و HTTP-سازگار است (مثل Web Server)، یک status
  //     غیر از 503 برمی‌گردد (حتی 404 هم یعنی سرور جواب داده و روشن است).
  //
  // پس قانون نهایی:
  //   status === 503        => Offline
  //   status دیگر (resolve) => Online
  //   Timeout (بدون پاسخ)   => Online  (یعنی سرویس غیر-HTTP روشن است)
  //   خطای واقعی شبکه       => Offline (هاست اصلاً در دسترس نیست)
  function checkService(ip, port) {
    var url = "http://" + ip + ":" + port + "/__probe__?_=" + Date.now() + "_" + Math.random();

    return new Promise(function (resolve) {
      var settled = false;

      var timer = setTimeout(function () {
        if (!settled) {
          settled = true;
          resolve(true); // Timeout روی پورت غیر-HTTP => سرویس روشن است
        }
      }, TIMEOUT_MS);

      fetch(url, { mode: "no-cors", cache: "no-store" })
        .then(function (resp) {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            var isOffline = (resp && resp.status === 503);
            resolve(!isOffline);
          }
        })
        .catch(function () {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            resolve(false); // خطای واقعی شبکه (هاست غیرقابل‌دسترس) => Offline
          }
        });
    });
  }

  function setBadge(index, isOnline) {
    var badge = document.getElementById("badge-" + index);
    if (!badge) return;
    if (isOnline) {
      badge.className = "status-badge status-online";
      badge.textContent = "Online";
    } else {
      badge.className = "status-badge status-offline";
      badge.textContent = "Offline";
    }
  }

  function setBadgeNA(index) {
    var badge = document.getElementById("badge-" + index);
    if (!badge) return;
    badge.className = "status-badge status-na";
    badge.textContent = "N/A - نیاز به ping دستی";
  }

  // بررسی غیرمستقیم DNS: چون نمی‌توان مستقیم روی پورت ۵۳ (UDP) تست کرد،
  // به‌جای IP از نام دامنه استفاده می‌شود تا مرورگر مجبور به عبور از
  // مرحله‌ی DNS Resolution شود.
  //
  // نکته‌ی مهم (برخلاف checkService): تارگت این تابع یک سرور HTTP واقعی
  // است (Web Server)، نه یک پروتکل ناشناس مثل FTP/SMTP. پس برخلاف
  // checkService، اینجا هیچ سناریویی برای «Timeout یعنی سرویس روشن است»
  // وجود ندارد. تست عملی روی Packet Tracer نشان داد وقتی DNS خاموش است،
  // fetch بلافاصله reject نمی‌شود (برخلاف مرورگرهای واقعی)؛ بلکه درخواست
  // معلق می‌ماند تا زمان Timeout سپری شود. بنابراین:
  //   پاسخ دریافت شد (هر status)  => نام Resolve شده  => DNS آنلاین
  //   خطای واقعی شبکه (catch)     => DNS آفلاین
  //   Timeout (بدون پاسخ)         => نام Resolve نشده  => DNS آفلاین
  //
  // محدودیت: این روش وضعیت "DNS resolution" را می‌سنجد، نه وضعیت دقیق
  // سرویس DNS به‌تنهایی؛ اگر DNS روشن باشد ولی Web Server خاموش باشد،
  // ممکن است این تست هم DNS را آفلاین نشان دهد (چون هیچ پاسخی نمی‌رسد).
  // برای دقت کامل، ping دستی همچنان توصیه می‌شود.
  function checkDnsViaHostname() {
    var url = "http://www.university.edu/__probe__?_=" + Date.now() + "_" + Math.random();

    return new Promise(function (resolve) {
      var settled = false;

      var timer = setTimeout(function () {
        if (!settled) {
          settled = true;
          resolve(false); // نام Resolve نشد (هیچ پاسخی نرسید) => DNS آفلاین
        }
      }, TIMEOUT_MS);

      fetch(url, { mode: "no-cors", cache: "no-store" })
        .then(function (resp) {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            // هر پاسخی (حتی 503) یعنی نام Resolve شده و درخواست به مقصد رسیده
            resolve(true);
          }
        })
        .catch(function () {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            // خطای واقعی شبکه یا عدم Resolve شدن نام => DNS آفلاین
            resolve(false);
          }
        });
    });
  }

  function updateSummary(results) {
    // فقط سرویس‌های TCP-based (Web, Mail, FTP) در گزارش کلی حساب می‌شوند،
    // چون DNS بر پایه UDP است و از طریق مرورگر قابل‌بررسی نیست.
    var total = results.length;
    var onlineCount = 0;
    for (var i = 0; i < results.length; i++) {
      if (results[i]) onlineCount++;
    }

    var summaryText = document.getElementById("summaryText");

    var label = "وضعیت کلی شبکه: " + onlineCount + " از " + total + " سرویس Online";
    if (onlineCount === total) {
      summaryText.className = "summary-ok";
      label += "  ( SUCCESS )";
    } else if (onlineCount === 0) {
      summaryText.className = "summary-fail";
      label += "  ( FAILED )";
    } else {
      summaryText.className = "summary-warn";
      label += "  ( WARNING )";
    }
    summaryText.textContent = label;
  }

  function checkAllServices() {
    // اگر یک دور بررسی قبلی هنوز در حال اجراست، دور جدید را رد کن تا
    // چند دور به‌طور همزمان با هم تداخل نکنند.
    if (isChecking) return;
    isChecking = true;

    currentGeneration = currentGeneration + 1;
    var myGeneration = currentGeneration;

    var refreshBtn = document.getElementById("refreshBtn");
    if (refreshBtn) {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "در حال بررسی...";
    }

    // همه‌ی بج‌ها را به حالت «در حال بررسی» برگردان
    for (var k = 0; k < SERVICES.length; k++) {
      var b = document.getElementById("badge-" + k);
      if (b) {
        b.className = "status-badge status-checking";
        b.textContent = "در حال بررسی...";
      }
    }

    var promises = [];
    for (var i = 0; i < SERVICES.length; i++) {
      (function (index) {
        var s = SERVICES[index];

        if (s.protocol === "udp") {
          // DNS: بررسی مستقیم پورت ۵۳ ممکن نیست (UDP)، به‌جای آن از طریق
          // موفقیت/شکست Resolve شدن نام دامنه به‌صورت غیرمستقیم بررسی می‌شود
          var pDns = checkDnsViaHostname().then(function (isOnline) {
            if (myGeneration !== currentGeneration) return null;
            var badge = document.getElementById("badge-" + index);
            if (badge) {
              if (isOnline) {
                badge.className = "status-badge status-online";
                badge.textContent = "Online (via DNS resolution)";
              } else {
                badge.className = "status-badge status-offline";
                badge.textContent = "Offline (via DNS resolution)";
              }
            }
            return isOnline;
          });
          promises.push(pDns);
          return;
        }

        var p = checkService(s.ip, s.port).then(function (isOnline) {
          // اگر دور بررسی جدیدتری از این شروع شده، این نتیجه را نادیده بگیر
          if (myGeneration !== currentGeneration) return null;
          setBadge(index, isOnline);
          return isOnline;
        });
        promises.push(p);
      })(i);
    }

    Promise.all(promises).then(function (results) {
      if (myGeneration !== currentGeneration) return; // نتیجه‌ی قدیمی، نادیده بگیر

      updateSummary(results);
      var now = new Date();
      document.getElementById("lastUpdate").textContent =
        "آخرین بروزرسانی: " + now.toLocaleTimeString();

      isChecking = false;
      if (refreshBtn) {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "بررسی الان (Refresh)";
      }
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", function () {
    checkAllServices();
  });

  renderInitialTable();
  checkAllServices();
  setInterval(checkAllServices, AUTO_REFRESH_MS);
</script>

</body>

    var badge = document.getElementById("badge-" + index);
    if (!badge) return;
    if (isOnline) {
      badge.className = "status-badge status-online";
      badge.textContent = "Online";
    } else {
      badge.className = "status-badge status-offline";
      badge.textContent = "Offline";
    }
  }

  function setBadgeNA(index) {
    var badge = document.getElementById("badge-" + index);
    if (!badge) return;
    badge.className = "status-badge status-na";
    badge.textContent = "N/A - نیاز به ping دستی";
  }

  // بررسی غیرمستقیم DNS: چون نمی‌توان مستقیم روی پورت ۵۳ (UDP) تست کرد،
  // به‌جای IP از نام دامنه استفاده می‌شود تا مرورگر مجبور به عبور از
  // مرحله‌ی DNS Resolution شود.
  //
  // نکته‌ی مهم (برخلاف checkService): تارگت این تابع یک سرور HTTP واقعی
  // است (Web Server)، نه یک پروتکل ناشناس مثل FTP/SMTP. پس برخلاف
  // checkService، اینجا هیچ سناریویی برای «Timeout یعنی سرویس روشن است»
  // وجود ندارد. تست عملی روی Packet Tracer نشان داد وقتی DNS خاموش است،
  // fetch بلافاصله reject نمی‌شود (برخلاف مرورگرهای واقعی)؛ بلکه درخواست
  // معلق می‌ماند تا زمان Timeout سپری شود. بنابراین:
  //   پاسخ دریافت شد (هر status)  => نام Resolve شده  => DNS آنلاین
  //   خطای واقعی شبکه (catch)     => DNS آفلاین
  //   Timeout (بدون پاسخ)         => نام Resolve نشده  => DNS آفلاین
  //
  // محدودیت: این روش وضعیت "DNS resolution" را می‌سنجد، نه وضعیت دقیق
  // سرویس DNS به‌تنهایی؛ اگر DNS روشن باشد ولی Web Server خاموش باشد،
  // ممکن است این تست هم DNS را آفلاین نشان دهد (چون هیچ پاسخی نمی‌رسد).
  // برای دقت کامل، ping دستی همچنان توصیه می‌شود.
  function checkDnsViaHostname() {
    var url = "http://www.university.edu/__probe__?_=" + Date.now() + "_" + Math.random();

    return new Promise(function (resolve) {
      var settled = false;

      var timer = setTimeout(function () {
        if (!settled) {
          settled = true;
          resolve(false); // نام Resolve نشد (هیچ پاسخی نرسید) => DNS آفلاین
        }
      }, TIMEOUT_MS);

      fetch(url, { mode: "no-cors", cache: "no-store" })
        .then(function (resp) {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            // هر پاسخی (حتی 503) یعنی نام Resolve شده و درخواست به مقصد رسیده
            resolve(true);
          }
        })
        .catch(function () {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            // خطای واقعی شبکه یا عدم Resolve شدن نام => DNS آفلاین
            resolve(false);
          }
        });
    });
  }

  function updateSummary(results) {
    // فقط سرویس‌های TCP-based (Web, Mail, FTP) در گزارش کلی حساب می‌شوند،
    // چون DNS بر پایه UDP است و از طریق مرورگر قابل‌بررسی نیست.
    var total = results.length;
    var onlineCount = 0;
    for (var i = 0; i < results.length; i++) {
      if (results[i]) onlineCount++;
    }

    var summaryText = document.getElementById("summaryText");

    var label = "وضعیت کلی شبکه: " + onlineCount + " از " + total + " سرویس Online";
    if (onlineCount === total) {
      summaryText.className = "summary-ok";
      label += "  ( SUCCESS )";
    } else if (onlineCount === 0) {
      summaryText.className = "summary-fail";
      label += "  ( FAILED )";
    } else {
      summaryText.className = "summary-warn";
      label += "  ( WARNING )";
    }
    summaryText.textContent = label;
  }

  function checkAllServices() {
    // اگر یک دور بررسی قبلی هنوز در حال اجراست، دور جدید را رد کن تا
    // چند دور به‌طور همزمان با هم تداخل نکنند.
    if (isChecking) return;
    isChecking = true;

    currentGeneration = currentGeneration + 1;
    var myGeneration = currentGeneration;

    var refreshBtn = document.getElementById("refreshBtn");
    if (refreshBtn) {
      refreshBtn.disabled = true;
      refreshBtn.textContent = "در حال بررسی...";
    }

    // همه‌ی بج‌ها را به حالت «در حال بررسی» برگردان
    for (var k = 0; k < SERVICES.length; k++) {
      var b = document.getElementById("badge-" + k);
      if (b) {
        b.className = "status-badge status-checking";
        b.textContent = "در حال بررسی...";
      }
    }

    var promises = [];
    for (var i = 0; i < SERVICES.length; i++) {
      (function (index) {
        var s = SERVICES[index];

        if (s.protocol === "udp") {
          // DNS: بررسی مستقیم پورت ۵۳ ممکن نیست (UDP)، به‌جای آن از طریق
          // موفقیت/شکست Resolve شدن نام دامنه به‌صورت غیرمستقیم بررسی می‌شود
          var pDns = checkDnsViaHostname().then(function (isOnline) {
            if (myGeneration !== currentGeneration) return null;
            var badge = document.getElementById("badge-" + index);
            if (badge) {
              if (isOnline) {
                badge.className = "status-badge status-online";
                badge.textContent = "Online (via DNS resolution)";
              } else {
                badge.className = "status-badge status-offline";
                badge.textContent = "Offline (via DNS resolution)";
              }
            }
            return isOnline;
          });
          promises.push(pDns);
          return;
        }

        var p = checkService(s.ip, s.port).then(function (isOnline) {
          // اگر دور بررسی جدیدتری از این شروع شده، این نتیجه را نادیده بگیر
          if (myGeneration !== currentGeneration) return null;
          setBadge(index, isOnline);
          return isOnline;
        });
        promises.push(p);
      })(i);
    }

    Promise.all(promises).then(function (results) {
      if (myGeneration !== currentGeneration) return; // نتیجه‌ی قدیمی، نادیده بگیر

      updateSummary(results);
      var now = new Date();
      document.getElementById("lastUpdate").textContent =
        "آخرین بروزرسانی: " + now.toLocaleTimeString();

      isChecking = false;
      if (refreshBtn) {
        refreshBtn.disabled = false;
        refreshBtn.textContent = "بررسی الان (Refresh)";
      }
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", function () {
    checkAllServices();
  });

  renderInitialTable();
  checkAllServices();
  setInterval(checkAllServices, AUTO_REFRESH_MS);
</script>
